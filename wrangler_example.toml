name = "majdata-wmc-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# 部署後把下面 database_id 改成你自己的
[[d1_databases]]
binding = "DB"
database_name = "majdata-scores"
database_id = "your database id"

[[kv_namespaces]]
binding = "maj_CACHE"
id = "your kv namespace id"

[observability.logs]
enabled = false
invocation_logs = true
